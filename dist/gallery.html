<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luffy Contribution Forms</title>
<style>
  :root{color-scheme:dark;--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--mute:#8b98a8;--hi:#39d353}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif;padding:28px 16px}
  h1{margin:0 0 4px;font-size:24px} p{color:var(--mute);margin:0 0 22px;max-width:70ch}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
  figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  figure.unlock{border-color:var(--hi)}
  img{display:block;width:100%;height:auto}
  figcaption{padding:10px 14px;display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:13px}
  figcaption b{color:var(--fg)} figcaption span{color:var(--fg)}
  @media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>Luffy — every form, every stage</h1>
<p>A new form unlocks every 400 contributions (green border). Between unlocks, each contribution still adds reach, speed, extra hits, blur, shockwave and debris.</p>
<div class="grid"><figure class="unlock"><img src="forms/0.svg" alt="Gear 1 at 0"/>
    <figcaption><b>0</b> contributions <span>Gear 1 — unlocked</span></figcaption></figure>
<figure class=""><img src="forms/100.svg" alt="Gear 1 at 100"/>
    <figcaption><b>100</b> contributions <span>Gear 1</span></figcaption></figure>
<figure class=""><img src="forms/200.svg" alt="Gear 1 at 200"/>
    <figcaption><b>200</b> contributions <span>Gear 1</span></figcaption></figure>
<figure class=""><img src="forms/300.svg" alt="Gear 1 at 300"/>
    <figcaption><b>300</b> contributions <span>Gear 1</span></figcaption></figure>
<figure class="unlock"><img src="forms/400.svg" alt="Gear 2 at 400"/>
    <figcaption><b>400</b> contributions <span>Gear 2 — unlocked</span></figcaption></figure>
<figure class=""><img src="forms/600.svg" alt="Gear 2 at 600"/>
    <figcaption><b>600</b> contributions <span>Gear 2</span></figcaption></figure>
<figure class=""><img src="forms/760.svg" alt="Gear 2 at 760"/>
    <figcaption><b>760</b> contributions <span>Gear 2</span></figcaption></figure>
<figure class="unlock"><img src="forms/800.svg" alt="Gear 3 at 800"/>
    <figcaption><b>800</b> contributions <span>Gear 3 — unlocked</span></figcaption></figure>
<figure class=""><img src="forms/1000.svg" alt="Gear 3 at 1000"/>
    <figcaption><b>1,000</b> contributions <span>Gear 3</span></figcaption></figure>
<figure class="unlock"><img src="forms/1200.svg" alt="Gear 4 · Boundman at 1200"/>
    <figcaption><b>1,200</b> contributions <span>Gear 4 · Boundman — unlocked</span></figcaption></figure>
<figure class=""><img src="forms/1400.svg" alt="Gear 4 · Boundman at 1400"/>
    <figcaption><b>1,400</b> contributions <span>Gear 4 · Boundman</span></figcaption></figure>
<figure class="unlock"><img src="forms/1600.svg" alt="Gear 4 · Snakeman at 1600"/>
    <figcaption><b>1,600</b> contributions <span>Gear 4 · Snakeman — unlocked</span></figcaption></figure>
<figure class=""><img src="forms/1800.svg" alt="Gear 4 · Snakeman at 1800"/>
    <figcaption><b>1,800</b> contributions <span>Gear 4 · Snakeman</span></figcaption></figure>
<figure class="unlock"><img src="forms/2000.svg" alt="Gear 5 at 2000"/>
    <figcaption><b>2,000</b> contributions <span>Gear 5 — unlocked</span></figcaption></figure>
<figure class=""><img src="forms/2600.svg" alt="Gear 5 at 2600"/>
    <figcaption><b>2,600</b> contributions <span>Gear 5</span></figcaption></figure></div>
</body></html>
